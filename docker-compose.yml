x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: ${INSTALL_DEV:-0}
  image: project-keys-app
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app

  # Scraping i powiadomienia. Osobno od AI, żeby długa ocena nie blokowała pobierania.
  worker:
    <<: *app
    command: php artisan queue:work --queue=notify,scrape,default --sleep=3 --tries=3 --max-time=3600

  # Ocena AI: kilka procesów naraz, limit AI_MAX_PER_MINUTE pilnuje Redis.
  worker-ai:
    <<: *app
    command: php artisan queue:work --queue=ai --sleep=3 --tries=3 --max-time=3600
    deploy:
      replicas: ${AI_WORKERS:-3}

  scheduler:
    <<: *app
    command: php artisan schedule:work

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    ports:
      # Bez domeny tylko localhost, dostęp przez tunel SSH.
      - "${CADDY_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${CADDY_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
