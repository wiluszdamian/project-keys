x-app: &app
  build:
    context: .
    target: app
    args:
      INSTALL_DEV: ${INSTALL_DEV:-0}
  image: project-keys-app
  restart: unless-stopped
  env_file: .env
  # Logi Laravela wspólne dla app, workerów i schedulera (strona Logi w panelu).
  volumes:
    - logs:/var/www/html/storage/logs
    # Stan kopii bazy (status.json) dla panelu i alertów, tylko do odczytu.
    - backups:/backups:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app

  # Scraping i powiadomienia. Osobno od AI, żeby długa ocena nie blokowała pobierania.
  worker:
    <<: *app
    command: php artisan queue:work --queue=notify,scrape,default --sleep=3 --tries=3 --max-time=3600

  # Ocena AI: kilka procesów naraz, limit AI_MAX_PER_MINUTE pilnuje Redis.
  worker-ai:
    <<: *app
    command: php artisan queue:work --queue=ai --sleep=3 --tries=3 --max-time=3600
    deploy:
      replicas: ${AI_WORKERS:-3}

  scheduler:
    <<: *app
    command: php artisan schedule:work

  # Czasy dojazdu: OSRM z mapą regionu, tylko w sieci Compose. Dane: scripts/osrm-prepare.sh.
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/car/region.osrm
    volumes:
      - osrm_data:/data:ro
    logging: *logging

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/bicycle/region.osrm
    volumes:
      - osrm_data:/data:ro
    logging: *logging

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Kopia bazy: codziennie pg_dump do wolumenu backups, raz w tygodniu test przywracania,
  # opcjonalnie kopia do Cloudflare R2. Skrypty w docker/backup, przywracanie: scripts/restore.sh.
  backup:
    build:
      context: .
      target: backup
    image: project-keys-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_R2_PATH: ${BACKUP_R2_PATH:-project-keys}
      BACKUP_R2_KEEP_DAYS: ${BACKUP_R2_KEEP_DAYS:-200}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    build:
      context: .
      target: web
      args:
        INSTALL_DEV: ${INSTALL_DEV:-0}
    image: project-keys-web
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-http://localhost}
      # Adresy IP z dostępem do bloku :80 (spacja między adresami). Sieci prywatne zawsze: tunel SSH i ruch z serwera.
      PANEL_ALLOWED_IPS: ${PANEL_ALLOWED_IPS:-127.0.0.1}
    ports:
      # Bez domeny: 127.0.0.1:8080 (tylko tunel SSH) albo 0.0.0.0:80 (z internetu, tylko z PANEL_ALLOWED_IPS).
      - "${CADDY_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${CADDY_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  logs:
  pgdata:
  backups:
  redisdata:
  caddy_data:
  caddy_config:
  # Tworzy go scripts/osrm-prepare.sh (mapa regionu i dane tras).
  osrm_data:
    name: project-keys_osrm_data
    external: true
